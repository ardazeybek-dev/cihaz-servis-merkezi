<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 520" role="img" aria-label="Ölçüm cihazı çizimi">
  <defs>
    <linearGradient id="govde" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#23292c"/>
      <stop offset=".45" stop-color="#3b4246"/>
      <stop offset="1" stop-color="#1c2124"/>
