# Yerel geliştirme: SQL Server 2022 + smtp4dev (gelen e-postaları http://localhost:5025 adresinde gösterir)
services:
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-Gelistirme.Sifre.2026}"
    ports:
      - "14333:1433"
    volumes:
      - sqlveri:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  smtp:
    image: rnwood/smtp4dev:v3
    ports:
      - "5025:80"
      - "2525:25"

volumes:
  sqlveri:
